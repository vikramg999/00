# hostapd.conf — rogue AP config
# wlan0 must be your wifi adapter in AP-capable mode (or use a USB adapter that supports AP mode)

interface=wlan0
driver=nl80211
ssid=Free_Public_WiFi
hw_mode=g
channel=6
auth_algs=1
wmm_enabled=0

# Open network (no WPA) — captive portal does the "authentication"
wpa=0
