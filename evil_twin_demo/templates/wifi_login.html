<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wi-Fi Network Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Arial, sans-serif; }
  body { background: #f2f4f7; display: flex; align-items: center; justify-content: center; height: 100vh; }
  .card { background: #fff; width: 360px; padding: 32px 28px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.12); text-align: center; }
  .wifi-icon { font-size: 40px; margin-bottom: 8px; }
  h1 { font-size: 18px; margin-bottom: 4px; color: #1a1a1a; }
  p.sub { color: #666; font-size: 13px; margin-bottom: 20px; }
  input[type=password] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; margin-bottom: 16px; }
  button { width: 100%; padding: 12px; background: #0078d4; color: #fff; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
  button:hover { background: #005fa3; }
  .footer { margin-top: 14px; font-size: 11px; color: #999; }
  .banner { background: #ffe9a8; color: #6b4e00; font-size: 12px; padding: 6px 10px; border-radius: 6px; margin-bottom: 16px; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <div class="banner">SIMULATED — SECURITY AWARENESS DEMO</div>
    <div class="wifi-icon">📶</div>
    <h1>Connect to "Free_Public_WiFi"</h1>
    <p class="sub">Enter the network password to continue</p>
    <form action="/wifi_auth" method="POST">
      <input type="password" name="wifi_password" placeholder="Wi-Fi Password" required autofocus>
      <button type="submit">Connect</button>
    </form>
    <div class="footer">This network requires authentication before granting internet access.</div>
  </div>
</body>
</html>
