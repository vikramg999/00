<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SecureTrust Bank - Sign In</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Arial, sans-serif; }
  body { background: #eef1f5; }
  .banner { background: #d32f2f; color: #fff; text-align: center; padding: 10px; font-size: 14px; font-weight: 700; letter-spacing: 0.5px; }
  .wrap { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 42px); }
  .card { background: #fff; width: 380px; padding: 36px 32px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
  .logo { font-size: 20px; font-weight: 700; color: #003366; margin-bottom: 4px; }
  .logo span { color: #0078d4; }
  h1 { font-size: 16px; color: #333; margin-bottom: 20px; font-weight: 500; }
  label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; }
  input { width: 100%; padding: 11px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; margin-bottom: 14px; }
  button { width: 100%; padding: 12px; background: #003366; color: #fff; border: none; border-radius: 5px; font-size: 14px; cursor: pointer; margin-top: 6px; }
  button:hover { background: #002244; }
  .footer { margin-top: 16px; font-size: 11px; color: #888; text-align: center; }
</style>
</head>
<body>
  <div class="banner">⚠ SIMULATED — SECURITY AWARENESS DEMO — NO REAL BANK, DO NOT ENTER REAL CREDENTIALS ⚠</div>
  <div class="wrap">
    <div class="card">
      <div class="logo">Secure<span>Trust</span> Bank</div>
      <h1>Sign in to your account</h1>
      <form action="/bank_auth" method="POST">
        <label>Username</label>
        <input type="text" name="username" required autofocus>
        <label>Password</label>
        <input type="password" name="password" required>
        <button type="submit">Sign In</button>
      </form>
      <div class="footer">Network verification required after Wi-Fi connection.</div>
    </div>
  </div>
</body>
</html>
